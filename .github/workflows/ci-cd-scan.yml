name: TeamTask Security & Code Analysis CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - stage
      - prod
  pull_request:
    branches:
      - dev
      - stage
      - prod

jobs:
  trivy-filesystem-scan-job:
    name: Trivy Filesystem Security Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          output: "trivy-fs-report.txt"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Filesystem Scan Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-scan-report
          path: trivy-fs-report.txt
          retention-days: 3

  trivy-docker-image-scan-job:
    name: Trivy Docker Image Vulnerability Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t teamtask-backend:latest .

      - name: Run Trivy scanner on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "teamtask-backend:latest"
          scan-type: "image"
          format: "table"
          output: "trivy-docker-report.txt"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Docker Image Scan Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-docker-scan-report
          path: trivy-docker-report.txt
          retention-days: 3

  sonarqube-code-scan-job:
    name: SonarQube Code Quality, Coverage & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate Code Coverage
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload Code Coverage Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 3

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=TeamTask-Backend
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
